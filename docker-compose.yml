services:
  # ---- Kafka broker (single-node, KRaft, no Zookeeper) ------------
  kafka:
    image: apache/kafka:3.9.2
    container_name: orders-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft single-node config (mirrors the official apache/kafka example).
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://kafka:9092,PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "eYkZQ0hOSmUiR2xYV0Rm3A"
      # Topic is explicitly created by `kafka-init` (1 partition); these settings
      # are a safety net so any auto-created topic also ends up with 1 partition
      # (RF=1, single node).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ---- Topic bootstrap: ensures "orders" exists (1 partition) -------
  # One-shot service that pre-creates the topic so the consumer never races
  # with auto-creation. Idempotent: safe on every `compose up`.
  kafka-init:
    image: apache/kafka:3.9.2
    container_name: orders-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders --partitions 1 --replication-factor 1

  # ---- Producer: publishes random order events to "orders" ----------
  producer:
    build: ./producer
    container_name: orders-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: orders
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---- Consumer: logs events pulled from "orders" -------------------
  consumer:
    build: ./consumer
    container_name: orders-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: orders
      KAFKA_GROUP_ID: orders-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped